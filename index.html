<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio SPA - Ihsan Maulana</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap" rel="stylesheet">
    
    <style>
        html {
    /* Paksa scrollbar vertikal selalu muncul agar layout tidak geser kiri-kanan */
            overflow-y: scroll; 
        }

        body {
            background-color: #F3F3F3;
            color: #333;
            /* Hilangkan scrollbar horizontal jika ada elemen yang 'off-side' */
            overflow-x: hidden; 
            width: 100%;
        }

        #content { 
            /* Beri tinggi minimal agar footer/konten tidak 'lompat' saat loading */
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            padding: 50px 90px 0 180px;
            /* Transisi opacity saja, jangan pakai slide agar tidak getar */
            transition: opacity 0.3s ease; 
        }
        /* --- CSS UTAMA (Tetap di Index) --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 80px; position: fixed; width: 100%; top: 0;
            background-color: rgba(243, 243, 243, 0.95); z-index: 1000;
        }

        .logo { font-size: 24px; font-weight: bold; color: #111; }
        
        nav ul { list-style: none; display: flex; gap: 35px; }
        nav ul li a { 
            text-decoration: none; color: #333; font-size: 14px; 
            font-weight: 500; cursor: pointer; transition: 0.3s;
            padding-bottom: 5px;
        }

        /* --- Indikator Menu Aktif --- */
        nav ul li a {
            position: relative;
            transition: color 0.3s ease;
        }

        /* Garis bawah animasi saat menu aktif */
        nav ul li a.active {
            color: #007BFF; /* Warna biru, bisa kamu ganti sesuai selera */
            font-weight: bold;
        }

        nav ul li a.active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #007BFF;
            border-radius: 2px;
        }
        /* Sidebar Sosial Media */
        .social-sidebar {
            position: fixed; 
            left: 30px; 
            top: 50%; 
            transform: translateY(-50%);
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            z-index: 100;
        }
        .social-icon {
            width: 35px; height: 35px; background: white; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            text-decoration: none; color: #333; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        .social-icon:hover { transform: scale(1.1); color: #007BFF; }

        /* AREA KONTEN DINAMIS */

        /* Class Reusable (Digunakan di file about.html, home.html, dll) */
        .hero-flex { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 50px; }
        .hero-text { max-width: 550px; }
        .hero-text h1 { font-size: 48px; font-weight: 800; line-height: 1.2; margin-bottom: 10px; }
        .hi-icon { font-size: 18px; margin-bottom: 5px; display: block; }
        .sub-title { font-size: 18px; font-weight: 600; color: #555; margin-bottom: 15px; }

        /* --- Hero Section (Konten Utama) --- */
        .hero {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 0px 20px; 
            position: relative;
            gap: 100px; 
        }

        /* -- Bagian Teks (Kiri) -- */
        .hero-text {
            max-width: 500px;
            margin-top: 0;
        }

        .hero-text .hi-icon {
            font-size: 20px;
            margin-bottom: 5px;
            display: inline-block;
        }

        .hero-text h1 {
            font-size: 48px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 5px;
            color: #111;
        }

        .hero-text .sub-title {
            font-size: 18px;
            font-weight: 600;
            color: #555;
            margin-bottom: 15px;
        }

        .hero-text p {
            font-size: 15px;
            color: #777;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* -- Bagian Gambar (Kanan) -- */
        .hero-image {
            position: relative;
            margin-top: 50px;
        }

        /* Bingkai bentuk unik */
        .image-frame {
            width: 380px;
            height: 450px;
            background-color: #E2E2E2; /* Warna bingkai */
            border-radius: 120px 120px 30px 120px; /* Bentuk asimetris */
            overflow: hidden; /* Agar gambar terpotong sesuai bingkai */
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Gambar nempel di bawah */
        }

        .image-frame img:not(.collage-grid img) {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
            object-position: 50% 10% ;
        }
        /* --- DESAIN TOMBOL --- */
        .btn-see-more {
            display: inline-block;
            padding: 12px 28px;
            background-color: #111; /* Warna tombol (Hitam) */
            color: #fff; /* Warna teks (Putih) */
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border-radius: 30px; /* Membuat ujung tombol melengkung/kapsul */
            margin-top: 15px;
            border: 2px solid #111;
            transition: all 0.3s ease; /* Transisi halus saat di-hover */
            cursor: pointer;
        }

        /* Efek saat mouse berada di atas tombol (Hover) */
        .btn-see-more:hover {
            background-color: transparent; /* Background jadi hilang */
            color: #111; /* Teks jadi hitam */
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); /* Tambah bayangan tipis */
        }
        .form-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-family: inherit;
            transition: 0.3s;
            box-sizing: border-box;
        }
        .form-input:focus {
            border-color: #C8B9A6;
            outline: none;
        }
        .error-msg {
            font-size: 11px;
            margin-top: 4px;
            display: block;
        }
/* --- RESPONSIVE UNTUK HP (Mobile Optimized) --- */
        @media (max-width: 480px) {
            header { 
                padding: 15px 20px; 
            }

            .logo { 
                font-size: 20px; 
            }

            /* Sembunyikan navigasi atau buat jadi simpel jika terlalu panjang */
            nav ul { 
                gap: 12px; 
            }
            
            nav ul li a { 
                font-size: 11px; /* Perkecil font menu agar muat satu baris */
            }

            /* Atur ulang layout konten */
            #content { 
                padding: 50px 20px 40px 20px; /* Hapus padding samping yang besar */
                display: block; /* Ubah flex ke block agar scroll ke bawah */
            }

            .hero-flex { 
                flex-direction: column-reverse; /* Foto di atas, teks di bawah */
                text-align: center; 
                gap: 30px; 
            }

            /* Ukuran Foto untuk HP */
            .image-frame { 
                width: 150px; /* Perkecil bingkai foto agar pas di layar HP */
                height: 200px; 
                margin: 0 auto; /* Tengah-tengah */
                border-radius: 60px 60px 15px 60px; 
            }

            /* Ukuran Teks untuk HP */
            .hero-text { 
                max-width: 100%; 
                margin-top: 0; 
            }

            .hero-text h1 { 
                font-size: 28px; /* Kecilkan judul nama agar tidak patah berantakan */
            }

            .hero-text .sub-title {
                font-size: 16px;
            }

            .hero-text p {
                font-size: 14px;
                margin-bottom: 20px;
            }

            /* Sembunyikan Sidebar Sosmed di HP (Atau taruh di bawah) */
            .social-sidebar {
                position: static;
                flex-direction: row; /* Berjejer ke samping */
                justify-content: center;
                transform: none;
                margin-top: 10px;
                padding-bottom: 20px;
            }
        }
        
    </style>
</head>
